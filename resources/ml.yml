            notebook_path: ${workspace.file_path}/notebooks/ml/23_publish_model_serving.py
            source: WORKSPACE
            base_parameters: *ml_common_parameters
          environment_key: ml_env
          timeout_seconds: 7200
          max_retries: 1
          min_retry_interval_millis: 30000
      environments: *ml_environments

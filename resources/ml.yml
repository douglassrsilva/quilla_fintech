resources:
  schemas:
    quilla_ml:
      name: ${var.ml_schema}
      catalog_name: ${resources.catalogs.quilla.name}
      comment: Quilla ML — Feature Store, evidências MLflow, modelos e inferências governadas.
      properties:
        project: quilla
        layer: ml
        managed_by: dabs
        data_classification: synthetic

  jobs:
    quilla_ml_data:
      name: "[${bundle.target}] Quilla | ML Data & Feature Store"
      description: Gera outcomes e cenários sintéticos em volume separado, valida contratos e publica Feature Tables no Unity Catalog.
      max_concurrent_runs: 1
      timeout_seconds: 21600
      queue:
        enabled: true
      tags:
        project: quilla
        workload: ml-data
        managed_by: dabs
        data_classification: synthetic
      tasks:
        - task_key: setup_ml
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/ml/10_setup_ml.py
            source: WORKSPACE
            base_parameters: &ml_common_parameters
              catalog: ${resources.catalogs.quilla.name}
              raw_schema: ${var.schema}
              silver_schema: ${var.silver_schema}
              ml_schema: ${resources.schemas.quilla_ml.name}
              ml_volume: ${var.ml_volume}
              ml_snapshot: ${var.ml_snapshot}
              seed: ${var.seed}
          environment_key: ml_env
          timeout_seconds: 1800
          max_retries: 2
          min_retry_interval_millis: 30000

        - task_key: generate_macro_market
          depends_on:
            - task_key: setup_ml
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/ml/11_generate_macro_market.py
            source: WORKSPACE
            base_parameters: *ml_common_parameters
          environment_key: ml_env
          timeout_seconds: 3600
          max_retries: 2
          min_retry_interval_millis: 30000

        - task_key: generate_credit_customer
          depends_on:
            - task_key: generate_macro_market
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/ml/12_generate_credit_customer.py
            source: WORKSPACE
            base_parameters:
              <<: *ml_common_parameters
              credit_case_rows: ${var.ml_credit_case_rows}
              party_rows: ${var.ml_party_rows}
          environment_key: ml_env
          timeout_seconds: 5400
          max_retries: 2
          min_retry_interval_millis: 30000

        - task_key: generate_security_cases
          depends_on:
            - task_key: setup_ml
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/ml/13_generate_security_cases.py
            source: WORKSPACE
            base_parameters:
              <<: *ml_common_parameters
              session_rows: ${var.ml_session_rows}
              party_rows: ${var.ml_party_rows}
              account_rows: ${var.account_rows}
              device_rows: ${var.device_rows}
              risk_alert_rows: ${var.ml_risk_alert_rows}
              insurance_case_rows: ${var.ml_insurance_case_rows}
          environment_key: ml_env
          timeout_seconds: 5400
          max_retries: 2
          min_retry_interval_millis: 30000

        - task_key: generate_pricing_investments
          depends_on:
            - task_key: generate_macro_market
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/ml/14_generate_pricing_investments.py
            source: WORKSPACE
            base_parameters:
              <<: *ml_common_parameters
              pricing_rows: ${var.ml_pricing_rows}
              profile_rows: ${var.ml_profile_rows}
              investment_event_rows: ${var.ml_investment_event_rows}
              party_rows: ${var.ml_party_rows}
              account_rows: ${var.account_rows}
          environment_key: ml_env
          timeout_seconds: 5400
          max_retries: 2
          min_retry_interval_millis: 30000

        - task_key: validate_ml_landing
          depends_on:
            - task_key: generate_credit_customer
            - task_key: generate_security_cases
            - task_key: generate_pricing_investments
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/ml/15_validate_ml_landing.py
            source: WORKSPACE
            base_parameters:
              <<: *ml_common_parameters
              credit_case_rows: ${var.ml_credit_case_rows}
              party_rows: ${var.ml_party_rows}
              session_rows: ${var.ml_session_rows}
              risk_alert_rows: ${var.ml_risk_alert_rows}
              insurance_case_rows: ${var.ml_insurance_case_rows}
              pricing_rows: ${var.ml_pricing_rows}
              profile_rows: ${var.ml_profile_rows}
              investment_event_rows: ${var.ml_investment_event_rows}
          environment_key: ml_env
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 30000

        - task_key: publish_feature_store
          depends_on:
            - task_key: validate_ml_landing
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/ml/16_build_feature_store.py
            source: WORKSPACE
            base_parameters:
              <<: *ml_common_parameters
              event_rows: ${var.ml_event_rows}
              interaction_rows: ${var.ml_interaction_rows}
          environment_key: ml_env
          timeout_seconds: 7200
          max_retries: 1
          min_retry_interval_millis: 30000

      environments: &ml_environments
        - environment_key: ml_env
          spec:
            client: "4"
            dependencies:
              - mlflow==3.3.2
              - scikit-learn==1.5.2
              - pandas==2.2.3
              - numpy==1.26.4
              - databricks-feature-engineering==0.13.0
              - databricks-sdk==0.65.0

    quilla_ml_train:
      name: "[${bundle.target}] Quilla | Train 22 Models"
      description: Treina, avalia, cria MLflow Traces, registra 22 modelos no Unity Catalog e promove aliases Champion/Challenger.
